services:
  - type: web
    name: food-ai
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: USE_SQLITE
        value: "1"
      - key: XKIRO_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

